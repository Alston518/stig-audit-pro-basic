name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test and validate YAML command policy
        run: python -m pytest -q
      - name: Validate Basic packaging inputs
        run: python -m PyInstaller --noconfirm --clean --distpath build/ci-dist --workpath build/ci-work "STIG Audit Basic.spec"
      - name: Build and run packaged offline smoke test
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath build/smoke-dist --workpath build/smoke-work "STIG Audit Basic Smoke.spec"
          $env:BASIC_SMOKE_OUTPUT = Join-Path $env:RUNNER_TEMP "stig-basic-smoke"
          & ".\build\smoke-dist\STIG Audit Basic Smoke\STIG Audit Basic Smoke.exe"
