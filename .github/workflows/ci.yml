name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test and validate YAML command policy
        run: python -m pytest
      - name: Validate generated command reference
        run: python scripts/generate_command_reference.py --check
      - name: Validate generated STIG traceability
        run: python scripts/generate_stig_traceability.py --check
      - name: Validate documentation
        run: python scripts/validate_docs.py
      - name: Validate packaging inputs
        run: python scripts/packaging_smoke_test.py
