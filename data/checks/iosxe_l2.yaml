- vuln_id: V-220666
  stig_id: CISC-L2-000200
  title: The Cisco switch must have all trunk links enabled statically.
  looking_for: Ensure all switchports report Negotiation of Trunking as Off
  stig_family: IOSXE_L2
  severity: cat2
  check_type: command_pattern_policy
  commands:
  - show interfaces switchport | include Negotiation of Trunking
  automated: true
  scope: {}
  conditions:
    all:
    - command: show interfaces switchport | include Negotiation of Trunking
      pattern: (?m)^[ \t]*Negotiation of Trunking:[ \t]*Off[ \t]*$
      description: at least one switchport reports trunk negotiation Off
    none:
    - command: show interfaces switchport | include Negotiation of Trunking
      pattern: (?m)^[ \t]*Negotiation of Trunking:(?![ \t]*Off[ \t]*$)[ \t]*.+$
      description: switchport with trunk negotiation not set to Off
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: true
    pass_comment: All reported switchports have Negotiation of Trunking set to Off.
    fail_comment: One or more switchports have Negotiation of Trunking enabled or set to an unexpected value.
    error_comment: Trunk negotiation status could not be evaluated.
    finding_details_template: default
- vuln_id: V-220667
  stig_id: CISC-L2-000210
  title: The Cisco switch must have all disabled switch ports assigned to an unused VLAN.
  looking_for: Exempt 802.1X access ports; require all other disabled or disconnected access ports to be shut down and assigned to the unused VLAN
  stig_family: IOSXE_L2
  severity: cat2
  check_type: interface_config_policy
  commands:
  - show running-config
  - show interfaces status
  automated: true
  scope:
    interfaces:
      include:
      - type: physical
        match:
          switchport_mode: access
          admin_state: disabled_or_notconnect
  conditions:
    exempt_strings:
    - string: authentication port-control auto
      description: 802.1X authentication configured
    required_patterns:
    - pattern: ^shutdown$
      description: shutdown configured
    - pattern: ^switchport access vlan\s+{{ unused_vlan }}$
      description: unused VLAN {{ unused_vlan }} assigned
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: true
    pass_comment: All non-exempt disabled or disconnected access ports are shut down and assigned to the unused VLAN.
    fail_comment: One or more non-exempt disabled or disconnected access ports are not shut down or are not assigned to the unused VLAN.
    error_comment: Disabled access-port configuration could not be evaluated.
    finding_details_template: default
