checks:
- vuln_id: V-220649
  stig_id: CISC-L2-000020
  title: The Cisco switch must uniquely identify and authenticate all network-connected endpoint devices before establishing any connection.
  looking_for: Require 802.1X and MAB on every physical access port and require all profile-defined RADIUS servers in the profile-defined AAA server group
  stig_family: IOSXE_L2
  severity: cat1
  check_type: interface_config_policy
  commands:
  - show running-config
  - show interfaces status
  automated: true
  scope:
    interfaces:
      include:
      - type: physical
        match:
          switchport_mode: access
  conditions:
    required_patterns:
    - pattern: ^authentication port-control auto$
      description: authentication port-control auto
    - pattern: ^dot1x pae authenticator$
      description: dot1x pae authenticator
    - pattern: ^mab$
      description: mab
    global_required_patterns:
    - pattern: ^aaa group server radius\s+{{ endpoint_authentication.radius_group }}\s*$
      description: RADIUS group {{ endpoint_authentication.radius_group }}
      object_type: radius_group
      object_name: "{{ endpoint_authentication.radius_group }}"
    profile_global_required_patterns:
    - profile_key: endpoint_authentication.radius_servers
      object_type: radius_server
      pattern_template: (?m)^aaa group server radius\s+{{ endpoint_authentication.radius_group }}\s*\r?\n(?:(?:[ \t]+[^\r\n]*)\r?\n)*[ \t]+server name\s+{{ item }}\s*$
      description_template: RADIUS server {{ item }} in group {{ endpoint_authentication.radius_group }}
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: true
    pass_comment: All physical access ports have 802.1X and MAB, and all profile-defined RADIUS servers are configured in the required AAA group.
    fail_comment: One or more access-port authentication commands, the required AAA RADIUS group, or a profile-defined RADIUS server is missing.
    error_comment: Endpoint authentication configuration could not be evaluated.
    finding_details_template: default
- vuln_id: V-220650
  stig_id: CISC-L2-000030
  title: The Cisco switch must authenticate all VLAN Trunk Protocol (VTP) messages with a hash function using the most secured
    cryptographic algorithm available.
  looking_for: Looking to see if VTP status is off in "show vtp status"
  stig_family: IOSXE_L2
  severity: cat2
  check_type: command_pattern_policy
  commands:
  - show vtp status
  - show running-config
  automated: true
  scope: {}
  conditions:
    any:
    - command: show vtp status
      pattern: ^\s*VTP Operating Mode\s*:\s*Off\s*$
      description: VTP operating mode is Off
    - command: show running-config
      pattern: ^\s*vtp password\s+\S+
      description: VTP password is configured
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: false
    pass_comment: Automated validation matched the configured strings/patterns for this requirement.
    fail_comment: Automated validation found missing required strings or present forbidden strings.
    error_comment: Automated validation could not be evaluated.
    finding_details_template: default
