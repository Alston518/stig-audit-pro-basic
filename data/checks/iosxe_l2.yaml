    include_command_output: false
    include_failed_objects: true
    pass_comment: Root Guard is configured on all CDP-identified access-switch-facing interfaces.
    fail_comment: Root Guard is missing on one or more CDP-identified access-switch-facing interfaces.
    error_comment: CDP neighbor and Root Guard validation could not be evaluated.
