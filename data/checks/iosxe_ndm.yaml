- vuln_id: V-220534
  stig_id: CISC-ND-000470
  title: The Cisco switch must be configured to prohibit the use of all unnecessary
    and nonsecure functions and services.
  looking_for: Ensure prohibited and unnecessary services are not enabled in the
    running configuration
  stig_family: IOSXE_NDM
  severity: cat1
  check_type: command_pattern_policy
  commands:
  - show running-config
  automated: true
  scope: {}
  conditions:
    none:
    - command: show running-config
      pattern: '(?m)^[ \t]*(?:boot[ \t]+network|ip[ \t]+boot[ \t]+server|ip[
        \t]+bootp[ \t]+server|ip[ \t]+dns[ \t]+server|ip[ \t]+identd|ip[ \t]+finger|ip[
        \t]+http[ \t]+server|ip[ \t]+rcmd[ \t]+rcp-enable|ip[ \t]+rcmd[ \t]+rsh-enable|service[
        \t]+config|service[ \t]+finger|service[ \t]+tcp-small-servers|service[ \t]+udp-small-servers|service[
        \t]+pad|service[ \t]+call-home)(?:[ \t]+[^\r\n]*)?[ \t]*$'
      description: prohibited or unnecessary service is enabled
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: true
    pass_comment: None of the prohibited or unnecessary services are enabled.
    fail_comment: One or more prohibited or unnecessary services are enabled.
    error_comment: The running configuration could not be evaluated for prohibited
      services.
    finding_details_template: default
- vuln_id: V-220535
  stig_id: CISC-ND-000490
  title: The Cisco switch must be configured with only one local account to be used
    as the account of last resort in the event the authentication server is unavailable.
  looking_for: Require exactly one local username using the profile-defined common-criteria password policy and require the profile-defined TACACS group before local in the default login authentication order
  stig_family: IOSXE_NDM
  severity: cat2
  check_type: command_pattern_policy
  commands:
  - show running-config
  automated: true
  scope: {}
  conditions:
    all:
    - command: show running-config
      pattern: '(?m)^[ \t]*username[ \t]+\S+[^\r\n]*$'
      description: one local username account is configured
    none:
    - command: show running-config
      pattern: '(?m)^[ \t]*username(?=[^\r\n]*$[\s\S]*?^[ \t]*username[ \t]+\S+[^\r\n]*$)'
      description: multiple local username accounts are configured
    profile_all:
    - command: show running-config
      profile_key: local_password_policy
      object_type: password_policy
      escape_item: true
      pattern_template: '(?m)^[ \t]*username[ \t]+\S+(?:[ \t]+[^\r\n]*?)?[ \t]+common-criteria-policy[ \t]+{{ item }}(?:[ \t]+[^\r\n]*)?[ \t]*$'
      description_template: local username using common-criteria policy {{ item }}
    - command: show running-config
      profile_key: tacacs_group
      object_type: aaa_authentication
      escape_item: true
      pattern_template: '(?m)^[ \t]*aaa[ \t]+authentication[ \t]+login[ \t]+default[ \t]+group[ \t]+{{ item }}[ \t]+local[ \t]*$'
      description_template: default login authentication uses group {{ item }} before local
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: true
    pass_comment: Exactly one local account uses the required common-criteria password policy, and the required TACACS group precedes local in the default login authentication order.
    fail_comment: The local-account count, common-criteria password policy, or default AAA login authentication order is incorrect.
    error_comment: Local fallback account and AAA authentication configuration could not be evaluated.
    finding_details_template: default
