schema_version: 1
library_name: iosxe_ndm
library_version: "2026.09"
checks:
- vuln_id: V-220518
  stig_id: CISC-ND-000010
  title: The Cisco switch must be configured to limit the number of concurrent management
    sessions to an organization-defined number.
  looking_for: Validate session-limit under every VTY section, or count the available
    VTY lines when session-limit is unsupported
  stig_family: IOSXE_NDM
  severity: cat2
  check_type: vty_session_limit_policy
  commands:
  - show running-config
  automated: true
  scope: {}
  conditions:
    command: show running-config
    maximum_sessions_profile_key: max_concurrent_management_sessions
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: true
    pass_comment: The number of concurrent management sessions does not exceed the
      organization-defined maximum of {{ max_concurrent_management_sessions }}.
    fail_comment: The VTY session limit or number of available VTY lines exceeds the
      organization-defined maximum of {{ max_concurrent_management_sessions }}.
    error_comment: Concurrent management-session limits could not be evaluated.
    finding_details_template: default
- vuln_id: V-220519
  stig_id: CISC-ND-000090
  title: The Cisco switch must be configured to automatically audit account creation.
  looking_for: Ensure archive log configuration auditing is enabled in the correct configuration hierarchy
  stig_family: IOSXE_NDM
  severity: cat2
  check_type: command_pattern_policy
  commands:
  - show running-config
  automated: true
  scope: {}
  conditions:
    all:
    - command: show running-config
      pattern: '(?m)^archive[ \t]*$'
      description: archive configuration section
    - command: show running-config
      pattern: '(?m)^archive[ \t]*\r?\n(?:(?:[ \t]+[^\r\n]*)\r?\n)*?[ \t]+log config[ \t]*$'
      description: log config subsection under archive
    - command: show running-config
      pattern: '(?m)^archive[ \t]*\r?\n(?:(?:[ \t]+[^\r\n]*)\r?\n)*?[ \t]+log config[ \t]*\r?\n(?:(?:[ \t]{2,}[^\r\n]*)\r?\n)*?[ \t]{2,}logging enable[ \t]*$'
      description: logging enable under archive log config
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: true
    pass_comment: Archive configuration auditing is enabled under the archive log config hierarchy.
    fail_comment: The archive section, log config subsection, or nested logging enable command is missing.
    error_comment: Archive configuration auditing could not be evaluated.
    finding_details_template: default
