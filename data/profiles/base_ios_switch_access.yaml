# Starter profile for ios_l2.yaml and ios_ndm.yaml.
# Copied from the current IOS-XE access baseline; edit the values for the IOS site
# before scanning.
profile_name: base_ios_switch_access
inherits: null
unused_vlan: 997
native_vlan: 20
management_vlan: 10
disabled_port_policy:
  require_shutdown: true
  required_access_vlan: 997
trunk_policy:
  vlan_1_must_be_pruned: true
  additional_pruned_vlans: []
dhcp_snooping:
  enabled: true
  vlans:
  - 30
  required_global_commands:
  - ip dhcp snooping
arp_inspection:
  enabled: true
  vlans:
  - 30
root_guard:
  # Device IDs from `show cdp neighbors detail` that are upstream cores/distribution switches.
  upstream_switches:
  - CORE-DIST-01
  - CORE-DIST-02
management_access:
  # ACL applied inbound to every VTY section.
  acl_name: EXAMPLE-MGMT-ACL
  networks:
  - network_address: 192.0.2.0
    subnet_mask: 255.255.255.0
endpoint_authentication:
  radius_group: EXAMPLE-RADIUS
  radius_servers:
  - RADIUS-SERVER-1
  - RADIUS-SERVER-2
  radius_server_addresses:
    RADIUS-SERVER-1: 192.0.2.18
    RADIUS-SERVER-2: 192.0.2.19
comments:
  default_open_prefix: Automated STIG validation found noncompliant configuration.
  default_pass_prefix: Automated STIG validation found required configuration present.
  default_error_prefix: Automated STIG validation could not confidently evaluate this requirement.
variables:
  site_label: Starter Cisco IOS access-switch profile
  required_user_vlans:
  - 30
  logging_servers:
  - 192.0.2.5
  - 192.0.2.6
  ntp_servers:
  - 192.0.2.23
  - 192.0.2.22
  # Approved IOS release for V-220621; update when your approved release changes.
  supported_ios_versions:
  - 15.2(7)E14
  local_password_policy: EXAMPLE-PASSWORD-POLICY
  tacacs_group: EXAMPLE-TACACS
  max_concurrent_management_sessions: 16
